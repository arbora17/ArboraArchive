<!DOCTYPE html>
<html>
<head>
<title>Arbora Tune</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style> 
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  margin-top: 100px;
  
}

h1 {
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;  /* optional, makes it all caps */
      letter-spacing: 2px;        /* optional, spaced letters */
      color: #07372d; 
      transform: scaleX(0.7);

    }

#bgvideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
}


</style>
</head>

<body>
  <!-- Video background -->
  <video autoplay muted loop id="bgvideo">
    <source src="homepage.mp4" type="video/mp4">
  </video>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Page content -->
  <div id="content">
    <h1>Arbora Tune</h1>
    <p>Website is working.</p>
  </div>

  <!-- Background audio -->
  <audio id="hpaudio" autoplay loop>
    <source src="homepageaudio.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let source;
    let buffer;
    
    // Load WAV
    fetch('homepageaudio.wav')
      .then(response => response.arrayBuffer())
      .then(data => audioCtx.decodeAudioData(data))
      .then(decoded => {
        buffer = decoded;
        initAudio();
      });
    
    function initAudio() {
      // Create a single buffer source
      source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
    
      // Create gain node for volume
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.15; // 15% volume
    
      // Connect source → gain → destination
      source.connect(gainNode).connect(audioCtx.destination);
    }
    
    // Start playback after user interaction
    function startAudio() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (source) {
        source.start(0);
      }
    }
    
    // Add click/tap listener to start audio
    document.addEventListener('click', startAudio, { once: true });
    </script>
</body>

</html>
