<!DOCTYPE html>
<html>
<head>
<title>Arbora Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style> 
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  margin-top: 100px;
  
}

h1 {
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;  /* optional, makes it all caps */
      letter-spacing: 2px;        /* optional, spaced letters */
      color: #07372d; 

    }

#bgvideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
}


</style>
</head>

<body>
  <!-- Video background -->
  <video autoplay muted loop id="bgvideo">
    <source src="homepage.mp4" type="video/mp4">
  </video>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Page content -->
  <div id="content">
    <h1>Arbora Archive</h1>
    <p>Website is working.</p>
  </div>

  <!-- Background audio -->
  <audio id="hpaudio" autoplay loop>
    <source src="homepageaudio.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audio = document.getElementById('hpaudio');
    
    document.addEventListener('click', () => {
      audio.volume = 0.15; // low volume
      audio.play().catch(() => console.log('Still blocked'));
    });
    </script>
</body>

</html>
