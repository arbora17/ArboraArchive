<!DOCTYPE html>
<html>
<head>
<title>Arbora Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style> 
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  margin-top: 100px;
  
}

h1 {
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;  /* optional, makes it all caps */
      letter-spacing: 2px;        /* optional, spaced letters */
      color: #07372d; 

    }

#bgvideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
}


</style>
</head>

<body>
  <!-- Video background -->
  <video autoplay muted loop id="bgvideo">
    <source src="homepage.mp4" type="video/mp4">
  </video>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Page content -->
  <div id="content">
    <h1>Arbora Archive</h1>
    <p>Website is working.</p>
  </div>

  <!-- Background audio -->
  <audio id="hpaudio" autoplay loop>
    <source src="homepageaudio.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let source;
    
    // Load WAV
    fetch('homepageaudio.wav')
      .then(response => response.arrayBuffer())
      .then(data => audioCtx.decodeAudioData(data))
      .then(buffer => {
        // Create source once
        source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
    
        // Set volume
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.15;
    
        // Connect to destination
        source.connect(gainNode).connect(audioCtx.destination);
    
        // Start looping
        source.start(0);
      });
    
    // Optional: resume on user interaction for mobile/Safari
    document.addEventListener('click', () => audioCtx.resume());
    </script>
</body>

</html>
